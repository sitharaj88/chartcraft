name: Deploy docs to GitHub Pages

# Manual only — run from the Actions tab ("Run workflow"), or with
#   gh workflow run deploy-docs.yml --ref main
# The automatic push trigger is intentionally disabled; restore the `push:` key
# below to deploy the docs on every push to main again.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `enablement: true` provisions the Pages site on first run, so a fresh
      # clone of this repo deploys without anyone visiting Settings → Pages.
      # Without it, `actions/deploy-pages` fails with "Get Pages site failed"
      # until Pages is switched on by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
