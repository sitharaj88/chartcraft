name: CI

# Manual only — run from the Actions tab ("Run workflow"), or with
#   gh workflow run ci.yml --ref main
# Automatic push/pull_request triggers are intentionally disabled; re-enable by
# restoring the `push:`/`pull_request:` keys below.
on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
