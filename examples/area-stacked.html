<!--
  ChartCraft example — stacked area chart.
  Run `npm run build` at the repo root first, then serve the REPO ROOT with any
  static server (e.g. `npx serve`) and open /examples/area-stacked.html.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChartCraft — Area (stacked)</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0 auto; padding: 2rem 1.5rem; max-width: 52rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #fcfcfb; color: #0b0b0b;
    }
    @media (prefers-color-scheme: dark) { body { background: #1a1a19; color: #ffffff; } }
    a { color: #2a78d6; } @media (prefers-color-scheme: dark) { a { color: #3987e5; } }
    #chart { height: 380px; }
    p.note { font-size: .9rem; color: #52514e; }
    @media (prefers-color-scheme: dark) { p.note { color: #c3c2b7; } }
  </style>
</head>
<body>
  <p><a href="index.html">← All examples</a></p>
  <div id="chart"></div>
  <p class="note">
    Note the gap in the Referral series in June (a <code>null</code> value):
    the band breaks instead of interpolating — missing data looks missing.
  </p>

  <script type="module">
    import { createChart } from '../packages/core/dist/index.mjs';

    createChart(document.querySelector('#chart'), {
      type: 'area',
      stacked: true,
      title: 'Site sessions by channel',
      subtitle: 'Weekly sessions, thousands',
      data: {
        categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                     'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
        series: [
          { id: 'organic', name: 'Organic search', curve: 'monotone',
            data: [48, 51, 55, 58, 61, 64, 62, 66, 71, 75, 79, 84] },
          { id: 'direct', name: 'Direct', curve: 'monotone',
            data: [22, 23, 22, 25, 26, 27, 26, 28, 29, 31, 32, 34] },
          { id: 'referral', name: 'Referral', curve: 'monotone',
            data: [11, 12, 14, 13, 15, null, 16, 17, 16, 18, 19, 21] },
          { id: 'paid', name: 'Paid', curve: 'monotone',
            data: [8, 9, 12, 15, 11, 9, 10, 14, 18, 16, 13, 12] },
        ],
      },
      yAxis: { label: 'Sessions (k)', min: 0 },
      legend: { position: 'bottom' },
    });
  </script>
</body>
</html>
