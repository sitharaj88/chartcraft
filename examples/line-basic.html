<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChartCraft â€” Line (basic)</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0 auto; padding: 2rem 1.5rem; max-width: 52rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #fcfcfb; color: #0b0b0b;
    }
    @media (prefers-color-scheme: dark) { body { background: #1a1a19; color: #ffffff; } }
    a { color: #2a78d6; } @media (prefers-color-scheme: dark) { a { color: #3987e5; } }
    #chart { height: 380px; }
  </style>
</head>
<body>
  <p><a href="index.html">â† All examples</a></p>
  <div id="chart"></div>

  <script type="module">
    import { createChart } from '../packages/core/dist/index.mjs';

    const chart = createChart(document.querySelector('#chart'), {
      type: 'line',
      title: 'Monthly recurring revenue',
      subtitle: 'FY2026, USD thousands',
      data: {
        categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                     'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
        series: [
          { id: 'enterprise', name: 'Enterprise',
            data: [182, 189, 195, 204, 216, 225, 231, 240, 252, 266, 281, 298] },
          { id: 'self-serve', name: 'Self-serve',
            data: [95, 99, 104, 102, 110, 118, 121, 127, 131, 138, 144, 151] },
        ],
      },
      yAxis: {
        label: 'MRR (USD k)',
        min: 0,
        ticks: { count: 5 },
      },
    });

    // The shared crosshair tooltip and the legend are on by default (2 series).
    chart.on('pointclick', (ev) => {
      console.log(`clicked ${ev.seriesName} â€” ${ev.x}: ${ev.y}`);
    });
  </script>
</body>
</html>
